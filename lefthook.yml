pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    stylelint:
      glob: "*.{css,scss,sass}"
      run: pnpm stylelint --fix {staged_files}
      stage_fixed: true
    tsgo:
      glob: "*.{ts,tsx}"
      run: pnpm tsgo --project packages/app/tsconfig.json
    vitest:
      glob: "packages/app/src/**/*.{ts,tsx}"
      run: pnpm vitest related {staged_files} --run
    cargo-fmt:
      glob: "packages/app/src-tauri/**/*.rs"
      root: "packages/app/src-tauri/"
      run: cargo fmt -- {staged_files}
      stage_fixed: true
    cargo-clippy:
      glob: "packages/app/src-tauri/**/*.rs"
      run: cd packages/app/src-tauri && cargo clippy --all-features --all-targets --locked -- -D warnings

pre-push:
  parallel: true
  commands:
    cargo-test:
      glob: "packages/app/src-tauri/**/*.rs"
      run: cd packages/app/src-tauri && cargo test --all-features --all-targets --locked
